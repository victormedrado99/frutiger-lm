[project]
name = "caderno"
version = "0.1.0"
description = "Caderno — organize notebooks de estudo, adicione fontes e converse com elas. Usa o Hermes Agent como motor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
]

[project.scripts]
caderno = "caderno.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caderno"]
