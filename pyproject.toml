[project]
name = "frutiger-lm"
version = "0.1.0"
description = "Frutiger LM — organize notebooks de estudo, adicione fontes, converse com elas e ligue o conhecimento num grafo ancorado."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "youtube-transcript-api>=1.0",
    # motor: agente LangGraph próprio (D017). Versões pinadas por D022.
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-openai==1.6.6",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.scripts]
frutiger-lm = "frutiger_lm.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "ARG"]
ignore = [
    "E501",  # a largura de linha é decisão do formatador, não do linter
    "B008",  # Body()/File() como default é o idioma do FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frutiger_lm"]
