<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frutiger LM</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📓</text></svg>">
</head>
<body>

  <header class="topbar">
    <div class="brand">Frutiger <span>LM</span></div>
    <div class="spacer"></div>
    <span class="pill" id="engine-pill"><span class="spinner"></span> verificando motor…</span>
    <button class="btn btn-ghost" id="btn-model" title="Configurar o modelo e a chave da API">Modelo</button>
    <button class="btn btn-primary" id="btn-new">Novo caderno</button>
  </header>

  <main class="page">
    <h1>Seus cadernos</h1>
    <div class="sub" id="subtitle">Carregando…</div>
    <div class="grid" id="grid"></div>

    <!-- grafo de conhecimento (F3) -->
    <section class="grafo" id="grafo-secao" hidden>
      <div class="grafo-head">
        <h2>Grafo de conhecimento</h2>
        <span class="grafo-stats" id="grafo-stats"></span>
        <div class="spacer"></div>
        <input type="search" id="grafo-busca" placeholder="buscar conceito…" autocomplete="off">
        <select id="grafo-caderno"></select>
        <label class="grafo-toggle" title="Mostra só as ligações que o material afirma. As pontilhadas são apenas conceitos que aparecem no mesmo trecho.">
          <input type="checkbox" id="grafo-sem-cooc"> só afirmadas
        </label>
      </div>
      <div class="grafo-legenda" id="grafo-legenda"></div>
      <div class="grafo-area">
        <canvas id="grafo-canvas"></canvas>
        <div class="grafo-vazio" id="grafo-vazio" hidden></div>
      </div>
    </section>
  </main>

  <!-- conceito: menções, trecho de origem e edição -->
  <aside class="conceito" id="conceito" hidden>
    <header class="conceito-head">
      <div>
        <h3 id="conceito-nome">—</h3>
        <div class="conceito-meta" id="conceito-meta"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btn-conceito-renomear" title="Renomear">Renomear</button>
      <button class="btn btn-ghost btn-sm" id="btn-conceito-mesclar" title="Juntar com outro conceito">Mesclar</button>
      <button class="btn btn-ghost btn-sm danger" id="btn-conceito-apagar" title="Apagar o conceito">✕</button>
      <button class="btn btn-ghost btn-sm" id="btn-conceito-fechar">Fechar</button>
    </header>
    <div class="conceito-corpo" id="conceito-corpo"></div>
  </aside>

  <!-- criar caderno -->
  <div class="overlay" id="modal-new" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Novo caderno</h2>
        <button class="btn btn-ghost btn-sm" data-close="modal-new">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="nb-title">Título</label>
          <input type="text" id="nb-title" placeholder="Ex.: Direito Constitucional — prova de novembro" autocomplete="off">
        </div>
        <div class="field">
          <label for="nb-desc">Descrição <span style="color:var(--muted)">(opcional)</span></label>
          <textarea id="nb-desc" rows="2" placeholder="O que você quer aprender ou revisar aqui?"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close="modal-new">Cancelar</button>
        <button class="btn btn-primary" id="btn-create">Criar caderno</button>
      </div>
    </div>
  </div>

  <!-- modelo: chave da API, provedor e modelo -->
  <div class="overlay" id="modal-model" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Modelo</h2>
        <button class="btn btn-ghost btn-sm" data-close="modal-model">✕</button>
      </div>
      <div class="modal-body">
        <p class="hint" id="md-intro" style="margin:0 0 16px">
          A chave fica só na sua máquina, em <code>data/model.json</code> com permissão
          <code>600</code>, e nunca é devolvida para o navegador. Endereço local
          (LM Studio, llama.cpp) não pede chave.
        </p>

        <div class="field">
          <label for="md-preset">Provedor</label>
          <select id="md-preset"></select>
        </div>

        <div class="field">
          <label for="md-url">Endereço</label>
          <input type="url" id="md-url" placeholder="https://api.deepseek.com/v1" autocomplete="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="md-model">Modelo</label>
          <input type="text" id="md-model" placeholder="deepseek-chat" autocomplete="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="md-key">Chave da API <span class="muted" id="md-key-state"></span></label>
          <input type="password" id="md-key" placeholder="cole a chave aqui" autocomplete="off">
          <div class="hint" id="md-key-hint"></div>
        </div>

        <div class="field">
          <label for="md-temp">Temperatura: <b id="md-temp-val">0.2</b></label>
          <input type="range" id="md-temp" min="0" max="1" step="0.1" value="0.2">
        </div>

        <div id="md-result" hidden></div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="btn-test-model">Testar conexão</button>
        <div class="spacer"></div>
        <button class="btn" data-close="modal-model">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-model">Salvar</button>
      </div>
    </div>
  </div>

  <!-- chat global: a barra de baixo conversa com todos os cadernos (F2) -->
  <div class="dock" id="dock">
    <div class="dock-panel" id="dock-panel">
      <div class="dock-head">
        <span class="dock-title">◆ Todos os seus cadernos</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="btn-dock-reset" title="Começa a conversa global do zero">Nova conversa</button>
      </div>
      <div class="messages dock-messages" id="dock-messages"></div>
    </div>
    <div class="dock-bar">
      <textarea id="dock-input" rows="1" placeholder="Pergunte a todos os seus cadernos…" spellcheck="false"></textarea>
      <button class="btn btn-primary" id="dock-send">Enviar</button>
    </div>
  </div>

  <script src="/static/md.js"></script>
  <script src="/static/graph.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
